<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draft Board · 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <h1 class="title">DRAFT<span class="title-accent">BOARD</span></h1>
      <span class="season-badge">2026</span>
      <!-- League selector: options are filled in by app.js from
           docs/leagues.json (which build.py generates from leagues.yaml),
           so the league list never gets hardcoded here. -->
      <select id="leagueSelect" class="league-select" aria-label="League"></select>
    </div>
    <!-- Mobile-only: hidden by default (display:none), shown by a media query
         below a phone-width breakpoint. Toggling it opens/closes
         #headerControls as a dropdown panel (see app.js initHeaderControls())
         so the sticky header itself stays a single short row instead of
         permanently occupying several rows of a phone screen. -->
    <button type="button" id="filtersToggle" class="filters-toggle"
            aria-expanded="false" aria-controls="headerControls">FILTERS</button>
    <div class="header-right" id="headerControls">
      <!-- Name search: filters the visible rows by player name, ANDed with the
           position filter and toggles below (handled in app.js getVisible()). -->
      <input type="search" id="searchBox" class="search-box"
             placeholder="SEARCH PLAYER…" aria-label="Search players by name"
             autocomplete="off" spellcheck="false">
      <div class="pos-filters" id="posFilters">
        <button class="filter-btn active" data-pos="ALL">ALL</button>
        <button class="filter-btn qb" data-pos="QB">QB</button>
        <button class="filter-btn rb" data-pos="RB">RB</button>
        <button class="filter-btn wr" data-pos="WR">WR</button>
        <button class="filter-btn te" data-pos="TE">TE</button>
        <button class="filter-btn flex" data-pos="FLEX">FLEX</button>
      </div>
      <label class="hide-toggle">
        <input type="checkbox" id="hideDrafted">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">HIDE DRAFTED</span>
      </label>
      <label class="hide-toggle dv-toggle">
        <input type="checkbox" id="excludeDV">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">DV LIST</span>
      </label>
      <!-- Compact/mobile view: shrinks each row down to rank + name + flag +
           position. The columns it hides (team, pos-rank, FPTS, VBD, the
           DRAFTED button) move into the existing tap-to-expand detail row
           instead of disappearing - see app.js render(). -->
      <label class="hide-toggle compact-toggle">
        <input type="checkbox" id="compactMode">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">COMPACT</span>
      </label>
    </div>
  </header>

  <div class="subbar">
    <span id="statAvail" class="subbar-stat">— AVAILABLE</span>
    <span class="subbar-divider">·</span>
    <span id="statDrafted" class="subbar-stat muted">— DRAFTED</span>
    <span class="subbar-divider">·</span>
    <!-- Live sync status: SYNCED (green) / OFFLINE (red) / NOT SYNCED (amber,
         when Firebase isn't configured). Set by app.js. -->
    <span id="syncStatus" class="sync-status">…</span>
    <span class="subbar-hint">click row to expand sources</span>
  </div>

  <div class="table-wrap">
    <table class="board" id="board">
      <thead>
        <tr>
          <th class="col-rk sortable active asc" data-col="rank">RK<span class="sort-arrow"></span></th>
          <th class="col-player">PLAYER</th>
          <th class="col-pos sortable" data-col="position">POS<span class="sort-arrow"></span></th>
          <th class="col-pts sortable" data-col="projected_points">FPTS<span class="sort-arrow"></span></th>
          <th class="col-vbd sortable" data-col="vbd">VBD<span class="sort-arrow"></span></th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="playerList"></tbody>
    </table>
  </div>

  <!-- app.js is an ES module: it imports the Firebase modular SDK from the
       gstatic CDN and the config from firebase-config.js. Module scripts are
       deferred, so the DOM is ready by the time it runs. -->
  <script type="module" src="app.js"></script>
</body>
</html>
