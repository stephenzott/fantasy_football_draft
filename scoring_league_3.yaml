# Family League (ESPN). Full PPR.
# Notes on this league's settings:
#   - no yards-allowed bonus (section omitted entirely)
#   - ESPN lists NO 22-27 points-allowed bucket (jumps from 18-21 straight to
#     28-34) — recorded exactly as shown
#   - misc section captures Total Fumbles Lost / Fumble Recovered for TD
passing:
  pass_yd: 0.04
  pass_td: 4
  pass_int: -2
  pass_2pt: 2
rushing:
  rush_yd: 0.1
  rush_td: 6
  rush_2pt: 2
receiving:
  reception: 1
  rec_yd: 0.1
  rec_td: 6
  rec_2pt: 2
misc:
  fumble_lost: -2         # offensive player who lost the fumble (FUML)
  fumble_recovery_td: 6   # any player returning a recovered fumble for a TD (FTD)
kicking:
  pat_made: 1
  fg_missed: -1
  fg_0_39: 3
  fg_40_49: 4
  fg_50_59: 5
  fg_60_plus: 6
defense_special_teams:
  kickoff_return_td: 6
  punt_return_td: 6
  int_return_td: 6
  fumble_return_td: 6
  blocked_return_td: 6
  two_pt_return: 2
  safety_1pt: 1
  sack: 1
  blocked_kick: 2
  interception: 2
  fumble_recovery: 2
  safety: 2
  points_allowed:
    "0": 11
    "1-6": 10
    "7-13": 8
    "14-17": 5
    "18-21": 2
    # note: ESPN lists no 22-27 tier for this league
    "28-34": -1
    "35-45": -3
    "46+": -5
  # note: this league has NO yards-allowed bonus (unlike league_1)
