leagues:
  - id: league_1
    name: "DC Brewnited"
    platform: espn
    draft_mode: live
    espn_league_id: 520090
    scoring_file: scoring_league_1.yaml
    roster:
      teams: 10
      starters:
        QB: 1
        RB: 2
        WR: 2
        TE: 1
        FLEX: 1
  - id: league_2
    name: "The League"
    platform: espn
    draft_mode: manual   # ESPN league, but draft happens offline; no polling
    espn_league_id: 215523
    scoring_file: scoring_league_2.yaml
    roster:
      teams: 8
      starters:
        QB: 1
        RB: 2
        WR: 2
        TE: 1
        FLEX: 1
  - id: league_3
    name: "Family League"
    platform: espn
    draft_mode: live
    espn_league_id: 37313507
    scoring_file: scoring_league_3.yaml
    # Kept out of the visible dropdown by request, but still fully built
    # (players.json, scoring, VBD) and reachable directly via
    # ?league=league_3 if needed.
    hidden_from_selector: true
    roster:
      teams: 12
      starters:
        QB: 1
        RB: 2
        WR: 2
        TE: 1
        FLEX: 1
  - id: league_4
    name: "Guillotine"
    platform: espn
    draft_mode: live
    espn_league_id: 873883121
    scoring_file: scoring_league_4.yaml
    # Guillotine is an 18-team survivor format but still uses a conventional
    # starting lineup, so VBD is computed the same way as the other leagues -
    # just with a much deeper baseline because of the 18 teams.
    roster:
      teams: 18
      starters:
        QB: 1
        RB: 2
        WR: 2
        TE: 1
        FLEX: 1
  - id: league_5
    name: "LA Champions"
    platform: sleeper
    draft_mode: manual   # drafting offline; Sleeper's API isn't used despite being available
    scoring_file: scoring_league_5.yaml
    # Kept out of the visible dropdown by request, but still fully built
    # (players.json, scoring, VBD) and reachable directly via
    # ?league=league_5 if needed.
    hidden_from_selector: true
    roster:
      teams: 12
      starters:
        QB: 1
        RB: 2
        WR: 2
        TE: 1
        FLEX: 1
  - id: league_6
    name: "Chess League"
    platform: sleeper
    draft_mode: manual   # drafting offline, like league_5; Sleeper's API isn't used
    scoring_file: scoring_league_6.yaml
    # Superflex league: the extra SUPERFLEX slot can start a 2nd QB, which
    # pushes QB replacement level much deeper than the other leagues' single
    # QB slot. vbd_baseline.qb is an explicit override read by
    # scripts/aggregate.py's compute_baselines() instead of the normal
    # teams*starters.QB formula - see superflex-qb-baseline.md for the design.
    # 22 is a placeholder; sanity-check it against real projected points
    # once players.json is built (look for a meaningful QB VBD bump around
    # rank 15-25 and confirm RB/WR/TE VBD is unaffected).
    vbd_baseline:
      qb: 22
    roster:
      teams: 12
      starters:
        QB: 1
        RB: 2
        WR: 2
        TE: 1
        FLEX: 1
        SUPERFLEX: 1
